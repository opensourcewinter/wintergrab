<!doctype html><html><head><style>
body{font:16px sans-serif;margin:20px}
.cards{display:grid;grid-template-columns:repeat(3,220px);gap:16px}
.card{border:1px solid #ddd;padding:10px}
.name{font-weight:700;margin-bottom:8px}
.stat{display:flex;gap:10px}
.stat .k{color:#777;width:70px}
</style></head><body>
<h1>Laptops</h1>
<div class="cards">
  <div class="card"><div class="name">Aero 13</div><div class="stat"><span class="k">Price</span><span>$999</span></div><div class="stat"><span class="k">Weight</span><span>1.1 kg</span></div></div>
  <div class="card"><div class="name">Aero 15</div><div class="stat"><span class="k">Price</span><span>$1,299</span></div><div class="stat"><span class="k">Weight</span><span>1.6 kg</span></div></div>
  <div class="card"><div class="name">Bolt 14</div><div class="stat"><span class="k">Price</span><span>$749</span></div><div class="stat"><span class="k">Weight</span><span>1.4 kg</span></div></div>
</div>
</body></html>
