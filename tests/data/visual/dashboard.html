<!doctype html><html><head><style>
body{font:16px sans-serif;margin:20px}
.side{float:left;width:180px}
.main{margin-left:220px}
.grid{display:grid;grid-template-columns:200px 120px 100px;gap:6px 12px}
.grid .h{font-weight:700}
.tiles{display:flex;gap:24px;margin:30px 0}
.tile{border:1px solid #ccc;padding:12px;width:160px}
.tile .v{font-size:32px;font-weight:700}
.tile .l{font-size:13px;color:#666}
.spec span.k{display:inline-block;width:120px;color:#555}
</style></head><body>
<div class="side"><p>Home</p><p>Pricing</p><p>Contact us</p><p>About</p></div>
<div class="main">
<h1>Plans</h1>
<div class="grid">
  <div class="h">Plan</div><div class="h">Price</div><div class="h">Seats</div>
  <div>Starter</div><div><span>$</span><span>9</span></div><div>1</div>
  <div>Team</div><div>$29</div><div>10</div>
  <div>Business</div><div>$99</div><div>50</div>
  <div>Enterprise</div><div>$299</div><div>500</div>
</div>
<div class="tiles">
  <div class="tile"><div class="v">1,284</div><div class="l">Active users</div></div>
  <div class="tile"><div class="l">Revenue</div><div class="v">$48.2k</div></div>
  <div class="tile"><div class="v">99.9%</div><div class="l">Uptime</div></div>
</div>
<div class="spec"><div><span class="k">Weight</span><span>1.2 kg</span></div><div><span class="k">Colour</span><span>Graphite</span></div></div>
<svg width="300" height="120"><text x="10" y="20">Q1</text><text x="80" y="20">Q2</text><text x="10" y="50">120</text><text x="80" y="50">180</text></svg>
</div></body></html>
