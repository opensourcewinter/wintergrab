name: Feature request
description: Something wintergrab could do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The task, and what gets in the way today. A real example helps most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: A command, a setting, an API. Or say if a plugin could do it (docs/plugins.md).
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
